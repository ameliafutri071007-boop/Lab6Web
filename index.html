 <!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praktikum DOM</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
        <hr>

    <h2>To-do List</h2>

    <input type="text" id="inputTugas" placeholder="Masukkan tugas">
    <button id="tombolTambah">Tambah Tugas</button>

    <ul id="daftarTugas"></ul>

    <p id="pesanTugas"></p>
<body>
    <h1>Form Pendaftaran Workshop</h1>

    <form id="formWorkshop" novalidate>
        <label for="namaWorkshop">Nama lengkap:</label>
        <input type="text" id="namaWorkshop">
        <p>Jumlah karakter nama: <span id="jumlahKarakter">0</span></p>

        <label for="emailWorkshop">Email:</label>
        <input type="email" id="emailWorkshop">

        <label for="sesiWorkshop">Pilih sesi:</label>
        <select id="sesiWorkshop">
            <option value="">-- Pilih sesi --</option>
            <option value="Pagi">Sesi Pagi</option>
            <option value="Siang">Sesi Siang</option>
            <option value="Sore">Sesi Sore</option>
        </select>

        <p id="ringkasanSesi">Sesi belum dipilih.</p>

        <button type="submit">Daftar Workshop</button>
        <button type="reset">Reset</button>
    </form>

    <p id="pesanWorkshop" aria-live="polite"></p>

    <hr>
<h2>Tombol Tampil/Sembunyi</h2>

<p id="teksSembunyi">Ini adalah teks yang bisa disembunyikan.</p>

<button id="tombolSembunyi">Sembunyikan/Tampilkan</button>

</body>
</html>
